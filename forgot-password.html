<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot password | Task Vault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div>
    <a class="brand" href="index.html" style="justify-content:center;display:flex;margin-bottom:24px">
      <span class="mark">TV</span> Task Vault
    </a>
    <main class="auth-card">
      <span class="eyebrow">Account recovery</span>
      <h1>Reset your password</h1>
      <p>Enter your email and we'll send a reset link.</p>
      <form class="demo-form" id="reset-form">
        <label for="email">Email address</label>
        <input id="email" type="email" required placeholder="you@company.co.za">
        <button class="btn primary full" type="submit">Send reset link</button>
        <p class="message" aria-live="polite"></p>
      </form>
      <p class="links"><a href="login.html">← Back to log in</a></p>
    </main>
  </div>
  <script type="module">
    import { resetPassword, friendlyAuthError } from "./js/auth.js";

    const form = document.getElementById("reset-form");
    const msg = form.querySelector(".message");
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      try {
        await resetPassword(form.email.value.trim());
        msg.textContent = "If that email exists, a reset link is on its way.";
      } catch (err) {
        msg.textContent = friendlyAuthError(err);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
